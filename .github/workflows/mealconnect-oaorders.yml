
name: MealConnect OAOrders Fetcher

on:
  workflow_dispatch:
    inputs:
      snapshot_timestamp:
        description: UTC snapshot timestamp (YYYY-MM-DD-HHMMSS)
        required: false
        type: string

permissions:
  contents: read

jobs:
  fetch-oaorders:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out data-bridge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/cesmn-org/libfetch.git"
          python -m pip install pandas pyarrow boto3

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Fetch, process, generate Parquet, and upload to R2
        env:
          MEALCONNECT_USERNAME: ${{ secrets.MEALCONNECT_USERNAME }}
          MEALCONNECT_PASSWORD: ${{ secrets.MEALCONNECT_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          SNAPSHOT_TIMESTAMP: ${{ inputs.snapshot_timestamp }}
        run: |
          python - <<'PY'
          import os
          import io
          import re
          import hmac
          from datetime import datetime, timezone

          import boto3
          import pandas as pd

          from botocore.config import Config
          from libfetch import OAOrders

          # Configuration
          username = os.environ["MEALCONNECT_USERNAME"]
          password = os.environ["MEALCONNECT_PASSWORD"]

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          access_key = os.environ["CLOUDFLARE_R2_ACCESS_KEY_ID"]
          secret_key = os.environ["CLOUDFLARE_R2_SECRET_ACCESS_KEY"]

          bucket = "data-bridge"

          required_values = {
              "MEALCONNECT_USERNAME": username,
              "MEALCONNECT_PASSWORD": password,
              "CLOUDFLARE_ACCOUNT_ID": account_id,
              "CLOUDFLARE_R2_ACCESS_KEY_ID": access_key,
              "CLOUDFLARE_R2_SECRET_ACCESS_KEY": secret_key,
          }

          missing = [
              name for name, value in required_values.items()
              if not value
          ]

          if missing:
              raise RuntimeError(
                  f"Required secrets are missing: {', '.join(missing)}"
              )

          # Direct identifiers to remove.
          remove_columns = {
              "FirstName",
              "MiddleName",
              "LastName",
              "Suffix",
              "EmailAddress",
              "PhoneNumber",
              "AddressLine1",
              "AddressLine2",
              "PrimaryDeliveryAddressName",
              "PrimaryDeliveryAddressLine1",
              "PrimaryDeliveryAddressLine2",
              "PrimaryDeliveryInstructions",
          }

          # Fetch report.
          fetcher = OAOrders(username, password).fetch()
          data = fetcher.to_bytes()

          if not data:
              raise RuntimeError("The downloaded report is empty")

          # Read all values as strings to preserve their original values.
          df = pd.read_csv(
              io.BytesIO(data),
              dtype=str,
              keep_default_na=False,
              encoding="utf-8-sig",
          )

          if "ID" not in df.columns:
              raise RuntimeError("Expected customer ID column is missing")

          missing_columns = remove_columns - set(df.columns)
          if missing_columns:
              raise RuntimeError(
                  "Expected identifier columns are missing: "
                  f"{sorted(missing_columns)}"
              )

          original_rows = len(df)

          # Remove direct identifiers.
          df = df.drop(columns=list(remove_columns))

          # Verify processed structure.
          if len(df.columns) != 53:
              raise RuntimeError(
                  f"Unexpected output column count: {len(df.columns)}"
              )

          if len(df) != original_rows:
              raise RuntimeError("Row count changed during processing")

          if any(column in df.columns for column in remove_columns):
              raise RuntimeError("Direct identifiers remain in output")

          # Generate Parquet entirely in memory.
          parquet_buffer = io.BytesIO()

          df.to_parquet(
              parquet_buffer,
              engine="pyarrow",
              index=False,
          )

          parquet_data = parquet_buffer.getvalue()

          if not parquet_data:
              raise RuntimeError("Parquet generation produced an empty file")

          # Read Parquet back and verify it.
          verified = pd.read_parquet(
              io.BytesIO(parquet_data),
              engine="pyarrow",
          )

          if len(verified) != original_rows:
              raise RuntimeError("Parquet row count verification failed")

          if list(verified.columns) != list(df.columns):
              raise RuntimeError("Parquet column verification failed")

          # Generate unique UTC object key.
          timestamp = os.environ.get("SNAPSHOT_TIMESTAMP", "").strip()
          if timestamp:
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}-\d{6}", timestamp):
                  raise RuntimeError("snapshot_timestamp must match YYYY-MM-DD-HHMMSS")
          else:
              timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%d-%H%M%S")

          object_key = (
              f"MEALCONNECT-CUSTOMER_ORDERS-{timestamp}.parquet"
          )

          # Connect to Cloudflare R2.
          s3 = boto3.client(
              "s3",
              endpoint_url=(
                  f"https://{account_id}.r2.cloudflarestorage.com"
              ),
              aws_access_key_id=access_key,
              aws_secret_access_key=secret_key,
              region_name="auto",
              config=Config(signature_version="s3v4"),
          )

          # Upload only the processed Parquet.
          s3.put_object(
              Bucket=bucket,
              Key=object_key,
              Body=parquet_data,
              ContentType="application/vnd.apache.parquet",
          )

          # Verify the uploaded object.
          uploaded = s3.head_object(
              Bucket=bucket,
              Key=object_key,
          )

          if uploaded["ContentLength"] != len(parquet_data):
              raise RuntimeError("R2 upload size verification failed")

          print("Fetch, processing, and upload successful")
          print(f"Source filename: {fetcher.suggested_filename}")
          print(f"Source bytes: {len(data)}")
          print(f"Parquet bytes: {len(parquet_data)}")
          print(f"Rows: {len(verified)}")
          print(f"Columns: {len(verified.columns)}")
          print("Direct identifiers removed: 12")
          print(f"R2 bucket: {bucket}")
          print(f"R2 object: {object_key}")
          print("R2 upload verification: passed")
          PY
