
name: WebDAV LogWarehouse Fetcher

on:
  workflow_dispatch:
    inputs:
      snapshot_timestamp:
        description: UTC snapshot timestamp (YYYY-MM-DD-HHMMSS)
        required: false
        type: string

permissions:
  contents: read

jobs:
  fetch-log-warehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out data-bridge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/cesmn-org/libfetch.git"
          python -m pip install pandas pyarrow boto3 openpyxl

      - name: Fetch, process, generate Parquet, and upload to R2
        env:
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          SNAPSHOT_TIMESTAMP: ${{ inputs.snapshot_timestamp }}
        run: |
          python - <<'PY'
          import os
          import io
          import re
          from datetime import datetime, timezone

          import boto3
          import pandas as pd

          from botocore.config import Config
          from libfetch import LogWarehouse

          username = os.environ["WEBDAV_USERNAME"]
          password = os.environ["WEBDAV_PASSWORD"]

          account_id = os.environ["CLOUDFLARE_R2_ACCOUNT_ID"]
          access_key = os.environ["CLOUDFLARE_R2_ACCESS_KEY_ID"]
          secret_key = os.environ["CLOUDFLARE_R2_SECRET_ACCESS_KEY"]

          bucket = "data-bridge"

          required_values = {
              "WEBDAV_USERNAME": username,
              "WEBDAV_PASSWORD": password,
              "CLOUDFLARE_R2_ACCOUNT_ID": account_id,
              "CLOUDFLARE_R2_ACCESS_KEY_ID": access_key,
              "CLOUDFLARE_R2_SECRET_ACCESS_KEY": secret_key,
          }

          missing = [
              name for name, value in required_values.items()
              if not value
          ]

          if missing:
              raise RuntimeError(
                  f"Required secrets are missing: {', '.join(missing)}"
              )

          expected_columns = {
              "Log Incoming": [
                  "Date",
                  "Source",
                  "Transaction Type",
                  "Product Type",
                  "Pounds",
                  "Note",
              ],
              "Log Outgoing": [
                  "Date",
                  "Product Type",
                  "Pounds",
                  "Note",
              ],
          }

          # Fetch the workbook.
          fetcher = LogWarehouse(username, password).fetch()
          data = fetcher.to_bytes()

          if not data:
              raise RuntimeError("The downloaded report is empty")

          workbook = pd.ExcelFile(io.BytesIO(data))

          # Generate and verify every Parquet file before uploading.
          parquet_files = {}

          for sheet, columns in expected_columns.items():
              if sheet not in workbook.sheet_names:
                  raise RuntimeError(
                      f"Expected worksheet is missing: {sheet}"
                  )

              df = pd.read_excel(
                  workbook,
                  sheet_name=sheet,
                  skiprows=2,
                  dtype=str,
                  keep_default_na=False,
              )

              if list(df.columns) != columns:
                  raise RuntimeError(
                      f"Unexpected columns in {sheet}: {list(df.columns)}"
                  )

              if len(df) == 0:
                  raise RuntimeError(
                      f"Worksheet contains no data rows: {sheet}"
                  )

              parquet_buffer = io.BytesIO()

              df.to_parquet(
                  parquet_buffer,
                  engine="pyarrow",
                  index=False,
              )

              parquet_data = parquet_buffer.getvalue()

              if not parquet_data:
                  raise RuntimeError(
                      f"Parquet generation produced an empty file: {sheet}"
                  )

              verified = pd.read_parquet(
                  io.BytesIO(parquet_data),
                  engine="pyarrow",
              )

              if len(verified) != len(df):
                  raise RuntimeError(
                      f"Row count verification failed: {sheet}"
                  )

              if list(verified.columns) != columns:
                  raise RuntimeError(
                      f"Column verification failed: {sheet}"
                  )

              if not verified.equals(df):
                  raise RuntimeError(
                      f"Data verification failed: {sheet}"
                  )

              parquet_files[sheet] = {
                  "data": parquet_data,
                  "rows": len(verified),
                  "columns": len(verified.columns),
              }

          # Use one timestamp for all files in this extraction.
          timestamp = os.environ.get("SNAPSHOT_TIMESTAMP", "").strip()
          if timestamp:
              if not re.fullmatch(r"\d{4}-\d{2}-\d{6}", timestamp):
                  raise RuntimeError("snapshot_timestamp must match YYYY-MM-DD-HHMMSS")
          else:
              timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%d-%H%M%S")

          object_keys = {
              "Log Incoming": (
                  f"WEBDAV-LOG-WAREHOUSE-INCOMING-{timestamp}.parquet"
              ),
              "Log Outgoing": (
                  f"WEBDAV-LOG-WAREHOUSE-OUTGOING-{timestamp}.parquet"
              ),
          }

          # Upload both verified Parquet files to R2.
          s3 = boto3.client(
              "s3",
              endpoint_url=(
                  f"https://{account_id}.r2.cloudflarestorage.com"
              ),
              aws_access_key_id=access_key,
              aws_secret_access_key=secret_key,
              region_name="auto",
              config=Config(signature_version="s3v4"),
          )

          for sheet, result in parquet_files.items():
              object_key = object_keys[sheet]
              parquet_data = result["data"]

              s3.put_object(
                  Bucket=bucket,
                  Key=object_key,
                  Body=parquet_data,
                  ContentType="application/vnd.apache.parquet",
              )

              uploaded = s3.head_object(
                  Bucket=bucket,
                  Key=object_key,
              )

              if uploaded["ContentLength"] != len(parquet_data):
                  raise RuntimeError(
                      f"R2 upload size verification failed: {object_key}"
                  )

          print("Fetch, processing, and upload successful")
          print(f"Source filename: {fetcher.suggested_filename}")
          print(f"Source bytes: {len(data)}")

          for sheet, result in parquet_files.items():
              print(f"\nWorksheet: {sheet}")
              print(f"Rows: {result['rows']}")
              print(f"Columns: {result['columns']}")
              print(f"Parquet bytes: {len(result['data'])}")
              print(f"R2 object: {object_keys[sheet]}")
              print("R2 upload verification: passed")

          print("\nWorksheets excluded: Dash Incoming, Dash Outgoing, Config")
          print("Notes retained unchanged")
          print(f"R2 bucket: {bucket}")
          PY
